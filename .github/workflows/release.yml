name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -e .

      - name: Check Python source
        run: python -m py_compile main.py src/cli.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build MaxPlusAI.exe
        run: python -m PyInstaller --clean --noconfirm MaxPlusAI.spec

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlusAI-Windows
          path: dist/MaxPlusAI.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" "dist/MaxPlusAI.exe" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "dist/MaxPlusAI.exe" --generate-notes --title "MAX ${{ github.ref_name }}"
          }

