name: Build & Auto-Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version Bump Type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      custom_notes:
        description: "Custom Release Notes (Leave blank to auto-read from CHANGELOG.md / Git log)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  bump_and_release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute Next Version, Update Changelog & Push Back to Repo
        id: version_step
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $bumpType = "${{ github.event.inputs.bump_type }}"
            if (-not $bumpType) { $bumpType = "patch" }
            $newTag = python scripts/bump_version.py --bump $bumpType
            Write-Host "Auto-bumped version to: $newTag"

            # Check for custom notes or extract from markdown/git
            $customNotes = @"
          ${{ github.event.inputs.custom_notes }}
          "@.Trim()

            if ($customNotes) {
              Set-Content -Path "release_notes.md" -Value $customNotes -Encoding utf8
            } else {
              python scripts/bump_version.py --notes $newTag --output-file "release_notes.md"
            }

            # Update CHANGELOG.md with new version section
            python scripts/bump_version.py --update-changelog $newTag

            # Commit and push version updates back to main
            git add CHANGELOG.md src/__init__.py src/max_ai/__init__.py src/core/updater.py src/core/mcp_manager.py setup.py pyproject.toml package.json package-lock.json js/src/index.ts
            $hasDiff = git diff --staged --name-only
            if ($hasDiff) {
              git commit -m "chore(release): bump version to $newTag [skip ci]"
              git push origin main
              git tag -a "$newTag" -m "Release $newTag" -f
              git push origin "$newTag" --force
            }
            "RELEASE_TAG=$newTag" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $tag = "${{ github.ref_name }}"
            python scripts/bump_version.py --set-version $tag
            python scripts/bump_version.py --notes $tag --output-file "release_notes.md"
            python scripts/bump_version.py --update-changelog $tag

            # Ensure main branch receives the version update
            git add CHANGELOG.md src/__init__.py src/max_ai/__init__.py src/core/updater.py src/core/mcp_manager.py setup.py pyproject.toml package.json package-lock.json js/src/index.ts
            $hasDiff = git diff --staged --name-only
            if ($hasDiff) {
              git commit -m "chore(release): sync version to $tag [skip ci]"
              git push origin main
            }
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -e .

      - name: Check Python source syntax
        run: python -m py_compile main.py src/cli.py

      - name: Run unit tests
        env:
          PYTHONPATH: src;.
        run: |
          python -m unittest discover -v -s tests -p "test_*.py"

      - name: Push debug log on failure
        if: failure()
        shell: pwsh
        run: |
          python -m unittest discover -v -s tests -p "test_*.py" > test_results.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          git add -f test_results.txt
          git commit -m "ci: debug test results"
          git push origin ci-debug --force


      - name: Build Python Distribution (Wheel & sdist)
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Build MaxPlusAI.exe
        run: python -m PyInstaller --clean --noconfirm MaxPlusAI.spec

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlusAI-Windows
          path: dist/MaxPlusAI.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Write-Host "Publishing release for tag: $tag"

          $notesFile = "release_notes.md"
          $hasNotes = Test-Path $notesFile

          $assets = @("dist/MaxPlusAI.exe")
          Get-ChildItem -Path "dist" -Filter "*.whl" | ForEach-Object { $assets += $_.FullName }
          Get-ChildItem -Path "dist" -Filter "*.tar.gz" | ForEach-Object { $assets += $_.FullName }

          if (gh release view "$tag" 2>$null) {
            Write-Host "Release $tag exists, updating release..."
            if ($hasNotes) {
              gh release edit "$tag" --notes-file "$notesFile" --title "MAX $tag"
            }
            gh release upload "$tag" $assets --clobber
          } else {
            Write-Host "Creating new release $tag..."
            if ($hasNotes) {
              gh release create "$tag" $assets --notes-file "$notesFile" --title "MAX $tag"
            } else {
              gh release create "$tag" $assets --generate-notes --title "MAX $tag"
            }
          }

          # Write Step Summary
          $summary = @"
          ## 🚀 MAX AI Release $tag Published Successfully!
          - **Tag:** $tag
          - **Executable:** [MaxPlusAI.exe](https://github.com/${{ github.repository }}/releases/download/$tag/MaxPlusAI.exe)
          - **Python Packages:** Wheel (.whl) and Source (.tar.gz) attached to release
          - **All project files updated and pushed back to main automatically by Bot!**
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  publish_github_package:
    name: Publish to GitHub Packages (ghcr.io)
    needs: bump_and_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and Push Docker Image to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_npm_package:
    name: Publish to GitHub npm Packages (@karanztez/max-ai)
    needs: bump_and_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@karanztez'

      - name: Install dependencies and compile TypeScript
        run: |
          npm ci
          npm test

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
