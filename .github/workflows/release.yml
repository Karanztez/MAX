name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python source
        run: python -m py_compile main.py

      - name: Build MaxPlusAI.exe
        run: python -m PyInstaller --clean --noconfirm MaxPlusAI.spec

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxPlusAI-Windows
          path: dist/MaxPlusAI.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" "dist/MaxPlusAI.exe" --generate-notes --title "MAX ${{ github.ref_name }}"
