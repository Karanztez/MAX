[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-ai"
version = "1.0.1"
description = "MAX AI Agent — Multi-Provider AI Assistant & Autonomous Tool Runner"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Karanztez" }]
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
max = "src.cli:run_cli"
max-gui = "src.ui.main_window:main"
