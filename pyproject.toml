[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-ai"
version = "1.0.6"
description = "MAX for AI — Multi-Provider AI Assistant & Autonomous Tool Runner"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary / Non-Commercial (Commercial License Required)" }
authors = [{ name = "Karanztez" }]
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.3.0"]
all = ["discord.py>=2.3.0", "psutil>=5.9.0"]

[project.scripts]
max = "src.cli:run_cli"
max-gui = "src.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "max_ai*"]

[tool.pyright]
extraPaths = ["."]
include = ["src", "tests", "scripts", "main.py"]

[tool.pyrefly]
project-root = "."
search-paths = [".", "src"]
extra-paths = ["."]
